name: Update calendar & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"
    - cron: "31-59/4 12-13 * * 1-5"
    - cron: "31-59/4 14-15 * * 3,4"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live calendar
        run: python scripts/fetch_calendar.py

      - name: Fetch official actuals (BLS + EIA)
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/fetch_actuals.py

      - name: Fetch market snapshot
        run: python scripts/fetch_markets.py

      - name: Build site folder
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/*.json _site/data/ 2>/dev/null || true

      - name: Commit calendar + actuals
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached --ignore-unmatch -q data/markets.json
          grep -qx "data/markets.json" .gitignore 2>/dev/null || echo "data/markets.json" >> .gitignore
          git add .gitignore data/calendar.json data/actuals.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: update data [skip ci]"
          git pull --rebase --autostash -X theirs || true
          git push

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
